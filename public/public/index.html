<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPL猜猜我是谁</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div id="home">
    <h2>KPL · 猜猜我是谁</h2>
    <button id="create">新建房间</button>
    <div style="margin:8px 0">或者输入房间号加入</div>
    <input id="roomInput" placeholder="房间码">
    <button id="join">加入房间</button>
    <div id="roomTip"></div>
  </div>

  <div id="game" class="hide">
    <div class="top-bar">
      <span id="roomShow"></span>
      <span id="turnTip"></span>
    </div>
    <div class="grid" id="playerGrid"></div>
    <div class="chat-box" id="chat"></div>
    <div class="input-row">
      <input id="qInput" placeholder="提问，例如：他是对抗路吗">
      <button id="sendQ">发送提问</button>
    </div>
    <div class="ans-row hide" id="ansArea">
      <span>对方问：<span id="qText"></span></span>
      <button data-v="yes">✅是</button>
      <button data-v="no">❌不是</button>
    </div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
